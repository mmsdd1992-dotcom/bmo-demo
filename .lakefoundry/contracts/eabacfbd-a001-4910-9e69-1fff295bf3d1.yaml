id: eabacfbd-a001-4910-9e69-1fff295bf3d1
title: BMO CIO Demo - Real-Time Fraud and Scam Defense
work_type: DATA_PRODUCT
version: 0.1.0
outcome: 'A board-ready, CIO-level demonstration of how Databricks can unify governed
  data, real-time pipelines, business semantics, natural-language analytics, and human-approved
  agentic workflows to detect and respond to bank-impersonation scams before funds
  leave the bank. The demo will be called `BMO Scam Defense Command Center` and will
  prove four points: 1. BMO can join identity, device, login, payment, payee, contact-center,
  case, and mule-risk signals in near real time. 2. Executives and fraud leaders can
  see governed KPIs with consistent metric definitions. 3. Business users can ask
  natural-language questions over trusted fraud and scam data. 4. An agentic Databricks
  App can recommend intervention plans, but humans approve any customer-impacting
  action. The central storyline will be a bank-impersonation scam wave, including
  a hero incident `ALERT-BMO-2026-001`.'
artifact_plan: 'Databricks solution including Unity Catalog catalog `bmo_fraud_demo`,
  with schemas: `raw`, `silver`, `features`, `serving`, `ai`, `governance`. Lakeflow
  pipelines: `bmo_fraud_01_bronze_ingest`, `bmo_fraud_02_signal_curation`, `bmo_fraud_03_feature_scoring`,
  `bmo_fraud_04_gold_serving`. A synthetic data generator with deterministic seed.
  An AI/BI dashboard (`BMO Scam Defense Command Center`) and a Databricks App (`BMO
  Scam Defense Command Center`). Metric view for governed fraud KPIs. Genie-ready
  views, table comments, column comments, synonyms, and sample questions. Agentic
  workflow components (Pattern Investigator, Risk Scoring, Policy Guardrail, Intervention
  Planner, Executive Briefing Agents). Audit and approval tables. Data model includes
  Raw, Silver Dimension, Silver Event and Case, Feature, Serving and Gold, and AI
  and Governance tables with specified columns, Delta data types, constraints, comments,
  and UC tags. Medallion architecture (Bronze, Silver, Feature, Gold/Serving, AI/Governance)
  with streaming or incremental processing.'
decisions:
- '**Approach A - Recommended: Executive Situation Room plus Fraud Response Workbench**
  will be implemented, combining an AI/BI dashboard for executive view with a Databricks
  App for guided investigation and response. This approach is chosen for its comprehensive
  demonstration of the full Databricks platform capabilities (Unity Catalog governance,
  Lakeflow pipelines, Delta tables, metric views, dashboards, Genie-style natural-language
  analytics, model scoring, lineage, and agentic workflow).'
- For synthetic data generation, the recommendation is to use Python with libraries
  like `Faker` for realistic data, augmented with custom scripts to introduce specific
  patterns and the hero incident as detailed in the requirements.
assumptions:
- Synthetic data only will be used; no real BMO client data, customer names, account
  numbers, or PII.
- Data will be realistic enough to simulate a North American bank (Canada and U.S.).
- A configurable parameter for smaller demo data will be available if needed.
- Streaming will be simulated with event-time batches and refreshable Delta tables
  if true streaming is not available in the builder.
open_questions: []
